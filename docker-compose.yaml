# contextgraph — a code-knowledge-graph MCP service. Two services, one door:
#
#   caddy ──/mcp*, /sse*──► cgc (CodeGraphContext behind mcp-proxy)
#        bearer-walled AT CADDY — cgc itself is never exposed.
#
#   ./install.sh            # .env with a strong random token + up -d --build
#
# Two ways code gets in (they coexist):
#   REPOS        git URLs — the container clones/pulls them itself and
#                re-indexes every REINDEX_HOURS. The zero-touch road.
#   INDEX_PATHS  folders already mounted into the container (see the
#                commented volume below) — indexed as they are, no clone;
#                whatever writes those folders keeps them fresh.
#
# Queries run against the graph, not the sources — so this stack can live
# anywhere Docker runs (a VPS, RunPod, …).
#
# With DOMAIN set in .env, add docker-compose.tls.yaml and Caddy serves
# real HTTPS on 80/443.

services:
  cgc:
    build: .
    restart: unless-stopped
    environment:
      REPOS: ${REPOS:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      INDEX_PATHS: ${INDEX_PATHS:-}
      REINDEX_HOURS: ${REINDEX_HOURS:-24}
      # Embedded-store buffer. The library default is multi-GB — far too
      # hungry for a shared box; 512 MB serves mid-size repos comfortably.
      CGC_EMBEDDED_BUFFER_POOL_MB: ${CGC_BUFFER_MB:-512}
    volumes:
      - cgc-data:/data
      # To index code that lives on THIS host, mount it read-only and name
      # it in INDEX_PATHS (comma-separated), e.g.:
      #   - /opt/neuralops/projects:/projects:ro
      #   INDEX_PATHS=/projects/<project-folder>/<repo>

  caddy:
    image: caddy:2.8.4-alpine
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      # ":8080" (plain HTTP) unless .env sets a real DOMAIN — the default
      # lives HERE because Caddy's own {$VAR:default} only applies when the
      # variable is UNSET, and compose always sets it.
      DOMAIN: ${DOMAIN:-:8080}
      CODEGRAPH_TOKEN: ${CODEGRAPH_TOKEN:?run ./install.sh (or make_env.py) first}
    depends_on: [cgc]
    restart: unless-stopped

volumes:
  cgc-data:
  caddy-data:
